<head>

<style>
:root{color-scheme:dark;--gold:#fbbf24;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e2e8f0;font:14px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:#243247;color:#f8fafc;border:1px solid #3b4b63;border-radius:8px;padding:9px 12px}button:hover{background:#384963}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#0f172a;color:#fff;border:1px solid #3b4b63;border-radius:8px;padding:10px;max-width:100%}.primary{background:#fbbf24;color:#111827;font-weight:800;border:0}.primary:hover{background:#fcd34d}.danger{color:#fda4af}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#0f172a;border-right:1px solid #253149;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:-1px}aside button{width:100%;text-align:left;margin:4px 0;display:flex;align-items:center;gap:10px;border:0;background:transparent}.active{background:#29354a!important;color:var(--gold)}main{padding:28px;min-width:0;max-width:1500px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 16px}h3{margin:8px 0}p{line-height:1.6}.muted{color:#94a3b8}.small{font-size:12px}.grid{display:grid;gap:16px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#151f30;border:1px solid #29354a;border-radius:14px;padding:20px;margin-bottom:16px}.stat{font-size:28px;font-weight:800}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:20px;background:#29354a}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:#fb7185}.bar{height:7px;background:#334155;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:#34d399}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid #29354a}th{color:#94a3b8;font-size:11px;text-transform:uppercase}.lib{border-left:4px solid #fbbf24}.sud{border-left:4px solid #34d399}.down{border-left:4px solid #fb7185}.mine{background:#263047}.pitch{position:relative;background:repeating-linear-gradient(0deg,#145b41 0,#145b41 60px,#176547 60px,#176547 120px);border:2px solid #9ed5b0;border-radius:8px;height:430px;overflow:hidden}.pitch:before{content:'';position:absolute;left:8%;right:8%;top:50%;border-top:1px solid #afd8ba}.pitch:after{content:'';position:absolute;width:95px;height:95px;border:1px solid #afd8ba;border-radius:50%;left:calc(50% - 48px);top:calc(50% - 48px);pointer-events:none}.area{position:absolute;left:25%;width:50%;height:17%;border:1px solid #afd8ba}.area.top{top:0}.area.bottom{bottom:0}.player{position:absolute;transform:translate(-50%,-50%);z-index:2;text-align:center;width:95px;font-size:10px;transition:all .6s}.shirt{margin:auto auto 4px;width:29px;height:29px;border-radius:50%;background:#fbbf24;color:#111827;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 8px #0008}.away .shirt{background:#e2e8f0}.ball{position:absolute;font-size:23px;z-index:3;transition:all .5s;transform:translate(-50%,-50%)}.feed{height:260px;overflow:auto}.feed p{border-bottom:1px solid #29354a;padding:8px 0;margin:0}.score{font-size:40px;font-weight:900}.welcome{max-width:760px;margin:7vh auto;padding:24px}.welcome .brand{font-size:54px}.field{display:grid;gap:7px;margin:18px 0}#toast{position:fixed;bottom:20px;right:20px;background:#e2e8f0;color:#0f172a;padding:14px 20px;border-radius:10px;z-index:20;max-width:90vw;display:none}dialog{background:#151f30;color:#e2e8f0;border:1px solid #475569;border-radius:14px;max-width:600px;width:90%;padding:25px}dialog::backdrop{background:#000b}.news{border-left:2px solid #475569;padding-left:14px;margin:16px 0}label{color:#cbd5e1}i,svg{width:18px;height:18px}#fatal{color:#fda4af}.legend{margin:12px 0}.empty{padding:30px;color:#94a3b8;text-align:center}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{height:auto;position:static;padding:12px}nav{display:flex;overflow:auto}aside button{width:auto;white-space:nowrap;font-size:12px}aside .clubinfo{display:none}main{padding:16px}.cols2,.cols3{grid-template-columns:1fr}header{align-items:flex-start}.score{font-size:30px}.pitch{height:400px}}
</style>

<body class="bg-slate-900 text-slate-100"><div id="app"></div><div id="toast" role="status"></div><dialog id="details"></dialog>
<script>
'use strict';
const VERSION=1, KEY='fm27-pasion-v1', FX=1200;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rnd(0,a.length-1)], clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
const date=d=>new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
const CLUBS=[['boca','Boca Juniors','river',84],['river','River Plate','boca',85],['racing','Racing Club','independiente',80],['independiente','Independiente','racing',76],['sanlorenzo','San Lorenzo','huracan',77],['huracan','Huracán','sanlorenzo',74],['newells',"Newell’s Old Boys",'central',74],['central','Rosario Central','newells',77],['talleres','Talleres','belgrano',78],['belgrano','Belgrano','talleres',73],['velez','Vélez Sarsfield','ferro',79],['estudiantes','Estudiantes','gimnasia',79]];
const CONTINENTAL=[['flamengo','Flamengo',86],['palmeiras','Palmeiras',85],['nacional','Nacional',77],['penarol','Peñarol',78]];
const FORMATIONS={'4-3-3':['POR','DEF','DEF','DEF','DEF','MED','MED','MED','DEL','DEL','DEL'],'4-4-2':['POR','DEF','DEF','DEF','DEF','MED','MED','MED','MED','DEL','DEL'],'3-5-2':['POR','DEF','DEF','DEF','MED','MED','MED','MED','MED','DEL','DEL']};
const STYLES=['Gegenpress','Garra/Huevo','Tiki-Taka','Salida de Contragolpe'];
const FIRST=['Santiago','Tomás','Agustín','Lucas','Matías','Nicolás','Franco','Joaquín','Bruno','Lautaro','Facundo','Ramiro','Ignacio','Emiliano','Valentín','Juan','Gonzalo','Federico','Diego','Gabriel','Alan','Leonardo','Pablo','Martín'];
const LAST=['Fernández','Gómez','Rodríguez','López','Martínez','Pérez','Romero','Díaz','Suárez','Torres','Acosta','Medina','Sosa','Castro','Herrera','Silva','Benítez','Arias','Vega','Rojas','Molina','Cabrera','Paz','Navarro'];
let GameState=null, view='dashboard', timer=null, speed=180, marketQuery='', marketPos='ALL', rosterPos='ALL';
window.GameState=GameState;
function toast(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>$('#toast').style.display='none',3500)}
function saveGame(silent=false){if(!GameState)return;try{localStorage.setItem(KEY,JSON.stringify(GameState));if(!silent)toast('Carrera guardada')}catch(e){toast('No se pudo guardar: revisá el espacio y los permisos del navegador')}}
function restoreGame(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s)return false;if(s.version!==VERSION||!Array.isArray(s.players)||!s.userClub||!Array.isArray(s.calendar))throw Error('Formato incompatible');GameState=s;window.GameState=s;if(s.match&&!s.match.done)s.match.paused=true;return true}catch(e){toast('El guardado no es compatible. Podés iniciar una carrera nueva.');return false}}
function resetGame(){if(!confirm('¿Eliminar esta carrera y comenzar de nuevo?'))return;clearInterval(timer);try{localStorage.removeItem(KEY)}catch(e){}GameState=null;window.GameState=null;view='dashboard';render()}
const club=id=>GameState.league.find(c=>c.id===id)||GameState.continental.find(c=>c.id===id);
const player=id=>GameState.players.find(p=>p.id===id);
const squad=id=>GameState.players.filter(p=>p.clubId===id);
const mine=()=>squad(GameState.userClub.id);
const foreigners=id=>squad(id).filter(p=>p.nacionalidad!=='Argentina').length;
const overall=p=>Math.round((p.posicion==='POR'?p.defensa*.4+p.fisico*.3+p.pase*.2+p.ritmo*.1:p.posicion==='DEF'?p.defensa*.4+p.fisico*.25+p.ritmo*.2+p.pase*.15:p.posicion==='MED'?p.pase*.35+p.regate*.25+p.fisico*.15+p.defensa*.15+p.ritmo*.1:p.tiro*.4+p.ritmo*.25+p.regate*.25+p.fisico*.1));
const morale=p=>p.moral<25?'Pésima':p.moral<45?'Baja':p.moral<65?'Normal':p.moral<85?'Buena':'Excelente';
function funds(delta){GameState.userClub.presupuesto_dolares+=delta;GameState.userClub.presupuesto_pesos=Math.round(GameState.userClub.presupuesto_dolares*FX)}
function news(title,body){GameState.news.unshift({date:GameState.today,title,body});GameState.news=GameState.news.slice(0,35)}
function makePlayer(id,clubId,pos,base,nationality='Argentina'){
 const skill=()=>clamp(base+rnd(-13,8),25,99), p={id,clubId,nombre:FIRST[id%FIRST.length]+' '+LAST[(Math.floor(id/FIRST.length)+id*7)%LAST.length],edad:rnd(18,34),posicion:pos,nacionalidad:nationality,ritmo:skill(),tiro:skill(),pase:skill(),regate:skill(),defensa:skill(),fisico:skill(),condicion_fisica:100,moral:70,estado_forma:6.5,injury:0,ban:0,contract:2028,goals:0};
 if(pos==='POR'){p.defensa=clamp(base+rnd(-5,5),30,99);p.tiro=rnd(15,35);p.regate=rnd(25,45)}
 if(pos==='DEF')p.tiro=clamp(p.tiro-20,15,99);
 p.valor_mercado=Math.round((overall(p)**3)*4*(p.edad<24?1.4:p.edad>30?.65:1)/10000)*10000;p.salario=Math.round(p.valor_mercado/350);p.clausula_rescision=p.valor_mercado*2;return p;
}
function standings(){return Object.fromEntries(GameState.league.map(c=>[c.id,{id:c.id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}]))}
function makeCalendar(year){
 const ids=GameState.league.map(c=>c.id), ring=[...ids], rounds=[];
 for(let r=0;r<ids.length-1;r++){const games=[];for(let i=0;i<ids.length/2;i++){let a=ring[i],b=ring[ids.length-1-i];if((r+i)%2)[a,b]=[b,a];games.push({home:a,away:b})}rounds.push(games);ring.splice(1,0,ring.pop())}
 const double=[...rounds,...rounds.map(g=>g.map(x=>({home:x.away,away:x.home})))], base=new Date(Date.UTC(year,1,1));while(base.getUTCDay()!==6)base.setUTCDate(base.getUTCDate()+1);
 const events=double.map((games,i)=>({id:'l'+i,type:'LPF',round:i+1,date:new Date(+base+i*7*864e5).toISOString().slice(0,10),games,done:false}));
 [4,10,16].forEach((r,i)=>events.push({id:'c'+i,type:'LIB',stage:i,round:i+1,date:new Date(+base+((r-1)*7+3)*864e5).toISOString().slice(0,10),done:false}));return events.sort((a,b)=>a.date.localeCompare(b.date));
}
function initCup(){const teams=[GameState.userClub.id,...GameState.league.filter(c=>c.id!==GameState.userClub.id).sort((a,b)=>b.rating-a.rating).slice(0,3).map(c=>c.id),...GameState.continental.map(c=>c.id)];for(let i=teams.length-1;i>0;i--){let j=rnd(0,i);[teams[i],teams[j]]=[teams[j],teams[i]]}GameState.cup={stages:[Array.from({length:4},(_,i)=>({home:teams[i*2],away:teams[i*2+1],result:null})),[],[]],winner:null}}
function newCareer(){const name=$('#manager').value.trim();if(!name){toast('Ingresá el nombre del DT');return}const id=$('#club').value, objective=$('#objective').value;
 GameState={version:VERSION,manager:name,year:2026,today:'2026-02-01',userClub:{id,nombre:CLUBS.find(c=>c[0]===id)[1],presupuesto_dolares:18000000,presupuesto_pesos:21600000000,cupos_extranjeros_usados:0,confianza_directiva:70,presion_hinchada:35,reputacion:65,objective},league:CLUBS.map(c=>({id:c[0],nombre:c[1],rival:c[2],rating:c[3]})),continental:CONTINENTAL.map(c=>({id:c[0],nombre:c[1],rating:c[2]})),players:[],calendar:[],standings:null,annual:null,eventIndex:0,tactics:{formation:'4-3-3',style:'Gegenpress',xi:[],bench:[]},news:[],match:null,finished:false};window.GameState=GameState;
 let pid=1;for(const c of [...GameState.league,...GameState.continental])for(let i=0;i<24;i++){const pos=i<3?'POR':i<11?'DEF':i<19?'MED':'DEL';GameState.players.push(makePlayer(pid++,c.id,pos,c.rating-5,i>=20?(c.id==='nacional'||c.id==='penarol'?'Uruguay':'Brasil'):'Argentina'))}
 for(let i=0;i<28;i++)GameState.players.push(makePlayer(pid++,null,['POR','DEF','MED','DEL'][i%4],rnd(60,82),i%3===0?pick(['Uruguay','Brasil','Colombia','Paraguay','Chile']):'Argentina'));
 GameState.calendar=makeCalendar(2026);GameState.today=GameState.calendar[0].date;GameState.standings=standings();GameState.annual=JSON.parse(JSON.stringify(GameState.standings));initCup();autoLineup();news('Arranca una nueva ilusión',`${name} asume en ${GameState.userClub.nombre}. Objetivo: ${objective}. El club disputará la fase final de Libertadores.`);saveGame(true);render();
}
function available(p){return p.injury===0&&p.ban===0}
function autoLineup(){const pool=mine().filter(available).sort((a,b)=>overall(b)*b.condicion_fisica-overall(a)*a.condicion_fisica), xi=[];for(const pos of FORMATIONS[GameState.tactics.formation]){const p=pool.find(p=>p.posicion===pos&&!xi.includes(p.id))||pool.find(p=>!xi.includes(p.id));if(p)xi.push(p.id)}GameState.tactics.xi=xi;const remaining=pool.filter(p=>!xi.includes(p.id)),keeper=remaining.find(p=>p.posicion==='POR');GameState.tactics.bench=[...(keeper?[keeper]:[]),...remaining.filter(p=>p!==keeper)].slice(0,7).map(p=>p.id)}
function currentEvent(){return GameState.calendar[GameState.eventIndex]}
function fixture(e){if(!e)return null;const games=e.type==='LPF'?e.games:GameState.cup.stages[e.stage];return games.find(g=>g.home===GameState.userClub.id||g.away===GameState.userClub.id)||null}
function positions(ids,formation,away=false){const parts=formation.split('-').map(Number), groups=[1,...parts], out=[];let k=0;groups.forEach((n,r)=>{for(let i=0;i<n;i++){let x=(i+1)*100/(n+1),y=88-r*(73/(groups.length-1));if(away){x=100-x;y=100-y}out.push({id:ids[k++],x,y})}});return out}
function pitch(ids,formation,awayIds=null,ball=null){const dots=positions(ids,formation).map((d,i)=>{const p=player(d.id);return p?`<div class="player" style="left:${d.x}%;top:${d.y}%"><span class="shirt">${i+1}</span>${esc(p.nombre.split(' ').slice(-1)[0])}</div>`:''}).join('');const away=awayIds?positions(awayIds,'4-3-3',true).filter(d=>player(d.id)).map((d,i)=>`<div class="player away" style="left:${d.x}%;top:${d.y}%"><span class="shirt">${i+1}</span>${esc(player(d.id).nombre.split(' ').slice(-1)[0])}</div>`).join(''):'';return `<div class="pitch"><div class="area top"></div><div class="area bottom"></div>${dots}${away}${ball?`<div class="ball" style="left:${ball.x}%;top:${ball.y}%">⚽</div>`:''}</div>`}
function render(){
 if(!GameState){$('#app').innerHTML=`<div class="welcome"><div class="brand">FM27<span class="green">.</span></div><p class="gold">PASIÓN CONTINENTAL · EDICIÓN ARGENTINA</p><h1>Tu club. Tu gente. Tu historia.</h1><p class="muted">12 clubes · 22 fechas · Libertadores · clásicos · mercado y decisiones en vivo. Planteles ficticios generados para cada carrera; simulación inspirada en el fútbol argentino, con reglamento simplificado.</p><div class="card"><h2>Nueva carrera</h2><label class="field">Nombre del DT<input id="manager" maxlength="40" value="" placeholder="Tu nombre" autocomplete="given-name"></label><label class="field">Club<select id="club">${CLUBS.map(c=>`<option value="${c[0]}">${esc(c[1])}</option>`).join('')}</select></label><label class="field">Objetivo del año<select id="objective"><option>Salir campeón</option><option>Clasificar a Libertadores</option><option>Evitar el descenso</option></select></label><button class="primary" data-action="new">Comenzar carrera</button></div><p class="small muted">Guardado local automático. No requiere cuenta ni servidor. Tipo de cambio de juego: USD 1 = ARS 1.200.</p></div>`;return}
 const u=GameState.userClub;u.cupos_extranjeros_usados=foreigners(u.id);
 const tabs=[['dashboard','house','Dashboard'],['squad','shirt','Plantilla'],['tactics','clipboard-list','Tácticas'],['tables','trophy','Tabla anual y copas'],['market','banknote','Mercado'],['match','circle-play','Próximo partido']];
 $('#app').innerHTML=`<div class="shell"><aside><div class="brand">FM27<span class="green">.</span></div><p class="small muted">PASIÓN CONTINENTAL</p><div class="clubinfo"><h3>${esc(u.nombre)}</h3><p class="muted small">DT ${esc(GameState.manager)}<br>Temporada ${GameState.year}</p></div><nav>${tabs.map(t=>`<button class="${view===t[0]?'active':''}" data-view="${t[0]}"><i data-lucide="${t[1]}"></i>${t[2]}</button>`).join('')}</nav><div class="clubinfo"><p class="small muted">${date(GameState.today)}<br>Reputación ${u.reputacion}/100</p><button data-action="save">Guardar carrera</button><button data-action="reset" class="danger">Nueva carrera</button></div></aside><main><header><div><div class="small gold">${esc(u.nombre)} · ${GameState.year}</div><h1>${tabs.find(t=>t[0]===view)[2]}</h1></div><div class="row"><span class="badge">${money(u.presupuesto_dolares)}</span><button data-action="save" title="Guardar">Guardar</button></div></header><div id="content">${({dashboard:dashboard,squad:roster,tactics:tactics,tables:tables,market:market,match:matchView})[view]()}</div></main></div>`;
 if(window.lucide)lucide.createIcons();
}
function dashboard(){const e=currentEvent(),g=fixture(e),u=GameState.userClub, rows=rank(GameState.annual), place=rows.findIndex(r=>r.id===u.id)+1;
 return `<div class="grid cols3"><div class="card"><div class="muted">Tabla anual</div><div class="stat">${place}º <span class="small muted">/ 12</span></div><p>${GameState.annual[u.id].pts} puntos · ${GameState.annual[u.id].pj} partidos</p></div><div class="card"><div class="muted">Confianza de la directiva</div><div class="stat green">${u.confianza_directiva}%</div>${bar(u.confianza_directiva)}<p class="small">Objetivo: ${esc(u.objective)}</p></div><div class="card"><div class="muted">Presión de la hinchada</div><div class="stat ${u.presion_hinchada>70?'red':'gold'}">${u.presion_hinchada}%</div>${bar(u.presion_hinchada,'#fbbf24')}<p class="small">Los clásicos duplican el impacto emocional.</p></div></div><div class="grid cols2"><div class="card"><h2>${GameState.finished?'Temporada finalizada':'Próximo compromiso'}</h2>${e?`<span class="badge">${e.type==='LPF'?'LPF · Fecha '+e.round:['Libertadores · Cuartos','Libertadores · Semifinal','Libertadores · Final'][e.stage]}</span><p class="muted">${date(e.date)}</p>${g?`<h2>${esc(club(g.home).nombre)}<br><span class="muted">vs</span> ${esc(club(g.away).nombre)}</h2>${isDerby(g)?'<p class="gold">🔥 CLÁSICO · intensidad +30%</p>':''}`:'<p>Jornada continental: tu club no tiene partido.</p>'}<button class="primary" data-view="match">Ir a la jornada</button>`:`<p>${seasonReport()}</p><button class="primary" data-action="season">Comenzar temporada ${GameState.year+1}</button>`}</div><div class="card"><h2>Finanzas y disponibilidad</h2><p>Presupuesto: <strong>${money(u.presupuesto_dolares)}</strong><br>Pesos: ARS ${u.presupuesto_pesos.toLocaleString('es-AR')}<br>Salarios semanales: ${money(mine().reduce((a,p)=>a+p.salario,0))}<br>Extranjeros: ${u.cupos_extranjeros_usados}/6<br>Lesionados: ${mine().filter(p=>p.injury).length} · Suspendidos: ${mine().filter(p=>p.ban).length}</p><p class="small muted">LPF: +USD 200.000 por victoria. Libertadores: +USD 1.500.000 por triunfo. Se recupera condición entre fechas; las sanciones duran un partido.</p></div></div><div class="card"><h2>La prensa del día</h2>${GameState.news.slice(0,8).map(n=>`<article class="news"><span class="small muted">${date(n.date)}</span><h3>${esc(n.title)}</h3><p class="muted">${esc(n.body)}</p></article>`).join('')}</div>`;

function bar(n,color='#34d399'){return `<div class="bar"><span style="width:${clamp(n)}%;background:${color}"></span></div>`}

function substitute(){const m=GameState.match;if(!m||m.done||m.substitutions>=5)return;const out=Number($('#out').value),into=Number($('#in').value),s=m.userSide,index=m.lineups[s].indexOf(out);if(index<0||!into||m.used.includes(into)||m.lineups.flat().includes(into)||!available(player(into)))return toast('Cambio no disponible');if(player(out).posicion==='POR'&&player(into).posicion!=='POR')return toast('El arquero debe ser reemplazado por otro POR');m.lineups[s][index]=into;m.used.push(out);m.ratings[into]=6.5;m.substitutions++;log(`🔄 Sale ${player(out).nombre}, entra ${player(into).nombre}. El DT mueve el banco.`);saveGame(true);render()}
function simulated(g,cup=false){const a=club(g.home).rating,b=club(g.away).rating;let home=0,away=0;for(let i=0;i<9;i++){if(Math.random()<.15+(a-b)*.004)home++;if(Math.random()<.13+(b-a)*.004)away++}const pen=cup&&home===away?penalties():null;return {home,away,pen,winner:home===away?(pen?(pen.home>pen.away?g.home:g.away):null):home>away?g.home:g.away}}
function updateTable(table,g,r){const h=table[g.home],a=table[g.away];h.pj++;a.pj++;h.gf+=r.home;h.gc+=r.away;a.gf+=r.away;a.gc+=r.home;if(r.home>r.away){h.g++;h.pts+=3;a.p++}else if(r.home<r.away){a.g++;a.pts+=3;h.p++}else{h.e++;a.e++;h.pts++;a.pts++}}
function resultImpact(g,r,cup){const u=GameState.userClub, home=g.home===u.id, gf=home?r.home:r.away,ga=home?r.away:r.home,win=r.winner===u.id||(gf>ga),draw=!cup&&gf===ga,mult=isDerby(g)?2:1,delta=(win?8:draw?0:-8)*mult;
 funds(win?(cup?1500000:200000):draw?60000:30000);u.confianza_directiva=clamp(u.confianza_directiva+(win?4:draw?0:-4)*mult);u.presion_hinchada=clamp(u.presion_hinchada-delta);u.reputacion=clamp(u.reputacion+(cup?(win?4:-2):(win?1:0)));
 for(const p of mine())p.moral=clamp(p.moral+delta);news(win?'La gente se ilusiona':draw?'Un punto y muchas preguntas':'La prensa aprieta',`${club(g.home).nombre} ${r.home}–${r.away} ${club(g.away).nombre}${r.pen?` (penales ${r.pen.home}–${r.pen.away})`:''}. ${cup?'El continente exige jerarquía.':'La tabla anual toma forma.'}${isDerby(g)?' El clásico deja huella en el vestuario.':''}`);
}
function completeEvent(userResult=null){const e=currentEvent(),g=fixture(e),m=GameState.match;for(const p of mine())if(p.ban&&!m?.red.includes(p.id))p.ban--;
 const games=e.type==='LPF'?e.games:GameState.cup.stages[e.stage];for(const game of games){const user=game===g,r=user&&userResult?userResult:simulated(game,e.type==='LIB');game.result=r;if(e.type==='LPF'){updateTable(GameState.standings,game,r);updateTable(GameState.annual,game,r)}if(user)resultImpact(game,r,e.type==='LIB')}
 if(m)for(const [id,rating] of Object.entries(m.ratings))player(Number(id)).estado_forma=clamp(rating,1,10);
 if(e.type==='LPF'){const wages=mine().reduce((a,p)=>a+p.salario,0);funds(-wages);if(GameState.userClub.presupuesto_dolares<0){GameState.userClub.confianza_directiva=clamp(GameState.userClub.confianza_directiva-8);news('Alerta financiera','Los salarios dejan el presupuesto en rojo. Necesitás vender jugadores.')}}
 else{const winners=games.map(x=>x.result.winner);if(e.stage<2)GameState.cup.stages[e.stage+1]=Array.from({length:winners.length/2},(_,i)=>({home:winners[i*2],away:winners[i*2+1],result:null}));else{GameState.cup.winner=winners[0];if(winners[0]===GameState.userClub.id){funds(5000000);GameState.userClub.reputacion=clamp(GameState.userClub.reputacion+10)}news('América tiene campeón',`${club(winners[0]).nombre} levanta la Copa Libertadores.`)}}
 e.done=true;GameState.eventIndex++;GameState.match=null;clearInterval(timer);const next=currentEvent();if(next){const days=Math.round((new Date(next.date)-new Date(e.date))/864e5);for(const p of GameState.players){p.condicion_fisica=clamp(p.condicion_fisica+days*4);p.injury=Math.max(0,p.injury-days)}GameState.today=next.date}else{GameState.finished=true;news('Se cierra la temporada',seasonReport());const place=rank(GameState.annual).findIndex(r=>r.id===GameState.userClub.id)+1,goal=GameState.userClub.objective,success=goal==='Salir campeón'?place===1:goal==='Clasificar a Libertadores'?place<=4:place<11;GameState.userClub.confianza_directiva=clamp(GameState.userClub.confianza_directiva+(success?15:-15));if(place===1)funds(3000000)}autoLineup();view='dashboard';saveGame(true);render();
}
function finishMatch(){const m=GameState.match;if(!m?.done)return;completeEvent({home:m.score[0],away:m.score[1],pen:m.pen,winner:m.score[0]===m.score[1]?(m.pen?(m.pen.home>m.pen.away?m.home:m.away):null):m.score[0]>m.score[1]?m.home:m.away})}
function advance(){if(!currentEvent()||fixture(currentEvent())||GameState.match)return;completeEvent()}
function seasonReport(){const rows=rank(GameState.annual),place=rows.findIndex(r=>r.id===GameState.userClub.id)+1;return `Campeón LPF: ${club(rows[0].id).nombre}. Tu club terminó ${place}º: ${place<=4?'clasificó a Libertadores':place<=8?'clasificó a Sudamericana':place>=11?'en zona de descenso':'conservó la categoría'}. La siguiente temporada conserva los 12 clubes para seguir la carrera; la zona de descenso afecta el objetivo y la confianza.`}
function nextSeason(){if(!GameState.finished)return;GameState.year++;GameState.eventIndex=0;GameState.finished=false;GameState.match=null;for(const p of GameState.players){p.edad++;p.goals=0;p.ban=0;p.injury=0;p.condicion_fisica=100;if(p.contract<GameState.year){if(p.clubId===GameState.userClub.id)news('Contrato finalizado',`${p.nombre} quedó libre.`);p.clubId=null;p.contract=GameState.year+1}}
 let pid=Math.max(...GameState.players.map(p=>p.id))+1;for(const c of [...GameState.league,...GameState.continental])for(const pos of ['POR','DEF','MED','DEL'])while(squad(c.id).filter(p=>p.posicion===pos).length<(pos==='POR'?3:pos==='DEL'?5:8)){GameState.players.push(makePlayer(pid++,c.id,pos,c.rating-8));GameState.players.at(-1).contract=GameState.year+2}
 GameState.calendar=makeCalendar(GameState.year);GameState.today=GameState.calendar[0].date;GameState.standings=standings();GameState.annual=JSON.parse(JSON.stringify(GameState.standings));initCup();funds(6000000);autoLineup();news('Nueva temporada',`Comienza ${GameState.year}. La directiva aporta USD 6.000.000 al presupuesto.`);saveGame(true);render()}
const actions={new:newCareer,save:()=>saveGame(),reset:resetGame,auto:()=>{if(locked())return;autoLineup();saveGame(true);render()},kickoff:startMatch,play:toggleMatch,sub:substitute,finish:finishMatch,advance,season:nextSeason,close:()=>$('#details').close()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.action)actions[b.dataset.action]?.();else if(b.dataset.player)details(Number(b.dataset.player));else if(b.dataset.buy)buy(Number(b.dataset.buy));else if(b.dataset.sell)sell(Number(b.dataset.sell));else if(b.dataset.renew)renew(Number(b.dataset.renew))});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='rosterPos'){rosterPos=el.value;render()}if(el.id==='marketPos'){marketPos=el.value;render()}if(el.id==='marketQuery'){marketQuery=el.value;render()}if(el.id==='formation'&&!locked()){GameState.tactics.formation=el.value;autoLineup();saveGame(true);render()}if(el.id==='style'||el.id==='liveStyle'){GameState.tactics.style=el.value;if(GameState.match)log('📋 Nuevo planteo: '+el.value);saveGame(true);render()}if(el.id==='speed'){speed=Number(el.value);if(GameState.match&&!GameState.match.paused){clearInterval(timer);timer=setInterval(tick,speed)}}if(el.dataset.slot!==undefined&&!locked()){const slot=Number(el.dataset.slot),id=Number(el.value)||null,all=[...GameState.tactics.xi,...GameState.tactics.bench],other=all.indexOf(id);if(other>=0&&other!==slot)all[other]=all[slot];all[slot]=id;GameState.tactics.xi=all.slice(0,11);GameState.tactics.bench=all.slice(11,18);saveGame(true);render()}});
window.addEventListener('beforeunload',()=>saveGame(true));document.addEventListener('visibilitychange',()=>{if(document.hidden&&GameState?.match&&!GameState.match.done){GameState.match.paused=true;clearInterval(timer);saveGame(true);render()}});
window.saveGame=saveGame;window.loadGame=function loadGame(){if(restoreGame()){view=GameState.match?'match':'dashboard';render();return true}return false};window.resetGame=resetGame;
restoreGame();if(GameState?.match)view='match';render();
</script>
