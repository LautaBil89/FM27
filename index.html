 for(let r=0;r<ids.length-1;r++){const games=[];for(let i=0;i<ids.length/2;i++){let a=ring[i],b=ring[ids.length-1-i];if((r+i)%2)[a,b]=[b,a];games.push({home:a,away:b})}rounds.push(games);ring.splice(1,0,ring.pop())}
 const double=[...rounds,...rounds.map(g=>g.map(x=>({home:x.away,away:x.home})))], base=new Date(Date.UTC(year,1,1));while(base.getUTCDay()!==6)base.setUTCDate(base.getUTCDate()+1);
 const events=double.map((games,i)=>({id:'l'+i,type:'LPF',round:i+1,date:new Date(+base+i*7*864e5).toISOString().slice(0,10),games,done:false}));
 [4,10,16].forEach((r,i)=>events.push({id:'c'+i,type:'LIB',stage:i,round:i+1,date:new Date(+base+((r-1)*7+3)*864e5).toISOString().slice(0,10),done:false}));return events.sort((a,b)=>a.date.localeCompare(b.date));
}

function newCareer(){const name=$('#manager').value.trim();if(!name){toast('Ingresá el nombre del DT');return}const id=$('#club').value, objective=$('#objective').value;
 GameState={version:VERSION,manager:name,year:2026,today:'2026-02-01',userClub:{id,nombre:CLUBS.find(c=>c[0]===id)[1],presupuesto_dolares:18000000,presupuesto_pesos:21600000000,cupos_extranjeros_usados:0,confianza_directiva:70,presion_hinchada:35,reputacion:65,objective},league:CLUBS.map(c=>({id:c[0],nombre:c[1],rival:c[2],rating:c[3]})),continental:CONTINENTAL.map(c=>({id:c[0],nombre:c[1],rating:c[2]})),players:[],calendar:[],standings:null,annual:null,eventIndex:0,tactics:{formation:'4-3-3',style:'Gegenpress',xi:[],bench:[]},news:[],match:null,finished:false};window.GameState=GameState;
 let pid=1;for(const c of [...GameState.league,...GameState.continental])for(let i=0;i<24;i++){const pos=i<3?'POR':i<11?'DEF':i<19?'MED':'DEL';GameState.players.push(makePlayer(pid++,c.id,pos,c.rating-5,i>=20?(c.id==='nacional'||c.id==='penarol'?'Uruguay':'Brasil'):'Argentina'))}
 for(let i=0;i<28;i++)GameState.players.push(makePlayer(pid++,null,['POR','DEF','MED','DEL'][i%4],rnd(60,82),i%3===0?pick(['Uruguay','Brasil','Colombia','Paraguay','Chile']):'Argentina'));
 GameState.calendar=makeCalendar(2026);GameState.today=GameState.calendar[0].date;GameState.standings=standings();GameState.annual=JSON.parse(JSON.stringify(GameState.standings));initCup();autoLineup();news('Arranca una nueva ilusión',`${name} asume en ${GameState.userClub.nombre}. Objetivo: ${objective}. El club disputará la fase final de Libertadores.`);saveGame(true);render();
}
function available(p){return p.injury===0&&p.ban===0}
function autoLineup(){const pool=mine().filter(available).sort((a,b)=>overall(b)*b.condicion_fisica-overall(a)*a.condicion_fisica), xi=[];for(const pos of FORMATIONS[GameState.tactics.formation]){const p=pool.find(p=>p.posicion===pos&&!xi.includes(p.id))||pool.find(p=>!xi.includes(p.id));if(p)xi.push(p.id)}GameState.tactics.xi=xi;const remaining=pool.filter(p=>!xi.includes(p.id)),keeper=remaining.find(p=>p.posicion==='POR');GameState.tactics.bench=[...(keeper?[keeper]:[]),...remaining.filter(p=>p!==keeper)].slice(0,7).map(p=>p.id)}
function currentEvent(){return GameState.calendar[GameState.eventIndex]}
function fixture(e){if(!e)return null;const games=e.type==='LPF'?e.games:GameState.cup.stages[e.stage];return games.find(g=>g.home===GameState.userClub.id||g.away===GameState.userClub.id)||null}
function positions(ids,formation,away=false){const parts=formation.split('-').map(Number), groups=[1,...parts], out=[];let k=0;groups.forEach((n,r)=>{for(let i=0;i<n;i++){let x=(i+1)*100/(n+1),y=88-r*(73/(groups.length-1));if(away){x=100-x;y=100-y}out.push({id:ids[k++],x,y})}});return out}
function pitch(ids,formation,awayIds=null,ball=null){const dots=positions(ids,formation).map((d,i)=>{const p=player(d.id);return p?`<div class="player" style="left:${d.x}%;top:${d.y}%"><span class="shirt">${i+1}</span>${esc(p.nombre.split(' ').slice(-1)[0])}</div>`:''}).join('');const away=awayIds?positions(awayIds,'4-3-3',true).filter(d=>player(d.id)).map((d,i)=>`<div class="player away" style="left:${d.x}%;top:${d.y}%"><span class="shirt">${i+1}</span>${esc(player(d.id).nombre.split(' ').slice(-1)[0])}</div>`).join(''):'';return `<div class="pitch"><div class="area top"></div><div class="area bottom"></div>${dots}${away}${ball?`<div class="ball" style="left:${ball.x}%;top:${ball.y}%">⚽</div>`:''}</div>`}

  function realPlayer(id,clubId,row){
    const [name,birthYear,position,nationality,rating,role]=row;
    const p=makePlayer(id,clubId,position,rating,nationality);
    p.nombre=name;p.registrationArgentina=(nationality==='Argentina'||(REAL_DATABASE.registrationArgentines||[]).includes(name));p.birthYear=birthYear;p.edad=GameState.year-birthYear;p.realIdentity=true;p.contract=GameState.year+rnd(1,3);
    const seeded=(salt,range)=>{let hash=id*103+salt*97;for(const ch of name)hash=(hash*31+ch.charCodeAt(0))>>>0;return hash%(range*2+1)-range};
    for(const [i,key] of ['ritmo','tiro','pase','regate','defensa','fisico'].entries())p[key]=clamp(rating+seeded(i,8),30,99);
    if(position==='POR'){p.defensa=rating;p.fisico=rating;p.pase=clamp(rating-6,1,99);p.tiro=25;p.regate=35}
    if(position==='DEF'){p.defensa=clamp(rating+3,1,99);p.tiro=clamp(rating-24,1,99)}
    if(position==='MED'){p.pase=clamp(rating+3,1,99);p.defensa=clamp(rating-10,1,99)}
    if(position==='DEL'){p.tiro=clamp(rating+3,1,99);p.defensa=clamp(rating-30,1,99)}
    p.potential=clamp(rating+(p.edad<22?12:p.edad<26?6:1),1,95);
    p.valor_mercado=Math.round(Math.pow(Math.max(1,rating-45),2.3)*1800*(p.edad<25?1.2:p.edad>32?.35:.8)/10000)*10000;
    p.valor_mercado=Math.max(100000,p.valor_mercado);p.salario=Math.round(p.valor_mercado/450/100)*100;
    p.clausula_rescision=Math.round(p.valor_mercado*2.2);p.role=role||{POR:'Arquero',DEF:'Defensor central',MED:'Centrocampista',DEL:'Delantero avanzado'}[position];
    p.foot=seeded(7,5)>0?'Izquierdo':'Derecho';p.shirtNumber=id%25+1;p.personalidad=pick(['Profesional','Ambicioso','Líder','Reservado']);
    const reference=REAL_DATABASE.playerDetails?.[name];
    if(reference){
      p.transfermarkt=structuredClone(reference);p.fecha_nacimiento=reference.dateOfBirth;p.heightCm=reference.heightCm;p.positionDetail=reference.positionDetail;
      p.foot=reference.foot||'Sin dato publicado';p.edad=ageAtDate(reference.dateOfBirth,GameState.today);
      p.registrationArgentina=p.registrationArgentina||reference.nationalities.includes('Argentina');p.argentineCitizen=p.registrationArgentina&&nationality!=='Argentina';
      p.marketValueOrigin=Number.isFinite(reference.marketValueEUR)&&reference.marketValueEUR>0?'Transfermarkt EUR convertido a USD de juego':'Estimación de juego; sin valor TM utilizable al corte';
      if(Number.isFinite(reference.marketValueEUR)&&reference.marketValueEUR>0)p.valor_mercado=Math.round(reference.marketValueEUR*REAL_DATABASE.dataSource.eurToUsd);
      p.salario=Math.max(100,Math.round(p.valor_mercado/450/100)*100);p.clausula_rescision=Math.round(p.valor_mercado*2.2);
      if(reference.shirtNumber&&Number.isInteger(Number(reference.shirtNumber)))p.shirtNumber=Number(reference.shirtNumber);
    }
    return sanitizePlayer(p);
  }

  function sendOffer(form){

  sell=function(id){if(locked())return;const p=player(id);if(mine().length<=18||mine().filter(q=>q.posicion===p.posicion).length<=2)return toast('Conservá 18 jugadores y al menos dos por posición');if(GameState.transferListed.includes(id)){GameState.transferListed=GameState.transferListed.filter(x=>x!==id);toast('Jugador retirado de la lista de transferibles')}else{GameState.transferListed.push(id);addMessage('Jugador transferible',`${p.nombre} está en el mercado. Se buscará comprador para la próxima jornada de liga. Podrás aceptar o rechazar la oferta.`, 'mercado');toast('Jugador puesto en la lista de transferibles')}saveGame(true);render()};

  function processOffers(){
    for(const offer of GameState.offers.filter(o=>o.status==='pending'&&o.type==='buy'&&o.dueAt<=GameState.eventIndex)){
      const p=player(offer.playerId),value=p.clubId?transferCost(p)*.9:0;
      let reason='';
      if(p.clubId!==offer.fromClub)reason='la situación contractual cambió';
      else if(offer.fee<value)reason='el club considera insuficiente el precio';
      else if(offer.wage<p.salario*(p.moral<40?1:1.05))reason='el jugador pide un salario mayor';
      else if(p.potential>=88&&GameState.userClub.reputacion<65&&offer.wage<p.salario*1.7)reason='el jugador exige mayor reputación o una mejora salarial del 70%';
      else if(mine().length>=32)reason='no quedan plazas en el plantel';
      else if(p.nacionalidad!=='Argentina'&&!p.registrationArgentina&&foreigners(GameState.userClub.id)>=6)reason='no quedan cupos de extranjeros';
      else if(offer.fee+offer.bonus>GameState.userClub.presupuesto_dolares)reason='los fondos disponibles no alcanzan';
      else if(wageBill()+offer.wage>GameState.userClub.wageBudget)reason='se supera el tope salarial';
      if(reason){offer.status='rejected';offer.reason=reason;addMessage('Negociación rechazada',`${p.nombre}: ${reason}. Podés mejorar la propuesta si sigue abierto el mercado.`, 'mercado');continue}
      transaction(-offer.fee-offer.bonus,`Fichaje y prima: ${p.nombre}`,'fichajes');p.clubId=GameState.userClub.id;p.registered=true;p.contract=GameState.year+offer.years;p.salario=offer.wage;p.moral=85;p.ban=0;offer.status='accepted';news('Fichaje cerrado',`${p.nombre} firma por ${offer.years} años. Traspaso ${money(offer.fee)}, prima ${money(offer.bonus)} y salario ${money(offer.wage)} semanales.`);
    }
    for(const id of GameState.transferListed){
      const p=player(id);if(!p||p.clubId!==GameState.userClub.id||GameState.offers.some(o=>o.playerId===id&&o.type==='sell'&&o.status==='pending'))continue;
      const destination=pick(GameState.league.filter(c=>c.id!==GameState.userClub.id));
      GameState.offers.unshift({id:'sale-'+Date.now()+'-'+id,playerId:id,type:'sell',fee:Math.round(p.valor_mercado*(.7+Math.random()*.25)/10000)*10000,toClub:destination.id,status:'pending',createdAt:GameState.eventIndex});
      addMessage('Oferta recibida',`${destination.nombre} presenta una propuesta por ${p.nombre}. Revisá Mercado para decidir si la aceptás.`, 'mercado');
    }
  }

  function applyTraining(days){
    const training=GameState.training,focus=labels[training.focus];let gains=0,injuries=0;
    for(const p of mine()){
      if(p.injury>0)continue;
      const personal=p.trainingFocus==='Equipo'?focus:labels[p.trainingFocus],intensity=training.intensity==='Alta'?1.4:training.intensity==='Baja'?.6:1;

      else if(personal){p.trainingProgress+=days*.055*intensity*(p.edad<23?1.5:p.edad>30?.55:1);if(p.trainingProgress>=1&&p[personal]<p.potential){p[personal]++;p.trainingProgress-=1;gains++}if(training.intensity==='Alta')p.condicion_fisica=clamp(p.condicion_fisica-days*.8)}

  }

    for (const pos of FORMATIONS['4-3-3']) {
      const p = pool.find(p => p.posicion === pos && !ids.includes(p.id)) ||
        (pos !== 'POR' ? pool.find(p => p.posicion !== 'POR' && !ids.includes(p.id)) : null);
      if (p) ids.push(p.id);
    }
    return ids;
  };

  startMatch = () => {
    if (GameState.match) { view = 'match'; render(); return; }
    const e = currentEvent(), g = fixture(e);
    if (!g) return advance();
    const t = GameState.tactics, ids = [...t.xi, ...t.bench];
    if (t.xi.length !== 11 || t.bench.length !== 7 || new Set(ids).size !== 18 ||
      ids.some(id => !player(id) || !available(player(id)))) {
      return toast('Necesitás once titulares y siete suplentes disponibles. Revisá la selección automática.');
    }
    if (player(t.xi[0]).posicion !== 'POR' || t.xi.filter(id => player(id).posicion === 'POR').length !== 1) {
      return toast('Debe haber un solo arquero titular, ubicado en el arco.');
    }
    if (ids.filter(id => player(id).nacionalidad !== 'Argentina' && !player(id).registrationArgentina && player(id).registered !== false).length > 6) {
      return toast('La convocatoria supera el límite de seis extranjeros.');
    }
    const homeUser = g.home === GameState.userClub.id;
    const userSide = homeUser ? 0 : 1;
    const lineups = [homeUser ? t.xi : aiXI(g.home), homeUser ? aiXI(g.away) : t.xi].map(ids => [...ids]);
    if (lineups.some(ids => ids.length !== 11)) return toast('El rival no tiene once jugadores disponibles para esta fecha.');
    const bench = [[], []]; bench[userSide] = [...t.bench];
    const aiSide = 1 - userSide;
    const reserves = squad(aiSide === 0 ? g.home : g.away)
      .filter(p => available(p) && !lineups[aiSide].includes(p.id))
      .sort((a, b) => overall(b) - overall(a));
    const backupKeeper = reserves.find(p => p.posicion === 'POR');
    bench[aiSide] = [...(backupKeeper ? [backupKeeper] : []), ...reserves.filter(p => p !== backupKeeper)].slice(0, 7).map(p => p.id);
    GameState.match = hydrate({
      eventId: e.id, home: g.home, away: g.away, userSide, minute: 0, addedTime: rnd(2, 5),
      score: [0, 0], stats: [0, 1].map(() => ({ shots: 0, fouls: 0, yellow: 0, red: 0, poss: 0 })),
      lineups, bench, initialLineups: lineups.map(ids => [...ids]),
      ratings: Object.fromEntries(lineups.flat().map(id => [id, 6.5])),
      yellow: {}, red: [], injured: [], used: [], substitutions: 0,
      feed: [{ minute: 0, text: 'Los equipos ya están en la cancha. El árbitro revisa su reloj y la tribuna se hace escuchar.' }],
      ball: { x: 50, y: 50 }, paused: true, done: false, derby: isDerby(g), pen: null,
      weather: pick(['Despejado', 'Nublado', 'Lluvia leve']),
      attendance: rnd(65, 100), halfTime: false, halfTimeTaken: false,
      aiTactics: { formation: '4-3-3', style: pick(['Equilibrado', 'Tiki-Taka', 'Salida de Contragolpe']),
        mentality: 'Equilibrada', tempo: rnd(42, 66), width: rnd(40, 68), line: rnd(35, 65), pressing: rnd(35, 70) }
    });
    if (GameState.match.derby) news('La ciudad espera el clásico', `${club(g.home).nombre} contra ${club(g.away).nombre}. La prensa pide carácter y la intensidad aumentará un 30%.`);
    view = 'match'; saveGame(true); render();
  };

  strength = side => {
    if (!GameState.match) return 0;
    const f = factors(side);
    return f.attack * .33 + f.build * .30 + f.defense * .30 + f.keeper * .07;
  };

  tick = () => {
    const m = GameState?.match;
    if (!m || m.paused || m.done) return;
    hydrate(m); m.minute++; m.halfTime = false;
    const home = factors(0), away = factors(1);
    const possessionBonus = f => (f.t.style === 'Tiki-Taka' ? 7 : f.t.style === 'Salida de Contragolpe' ? -7 : f.t.style === 'Gegenpress' ? 2 : 0) +
      (f.t.pressing - 50) * .035 + (f.t.line - 50) * .035;
    const homeShare = clamp(50 + (home.build - away.build) * .52 + 2.3 + possessionBonus(home) - possessionBonus(away) + rnd(-5, 5), 23, 77);
    m.stats[0].poss += homeShare / 100; m.stats[1].poss += 1 - homeShare / 100;
    m.stats[0].possession = m.stats[0].poss / m.minute * 100;
    m.stats[1].possession = 100 - m.stats[0].possession;
    const side = Math.random() < homeShare / 100 ? 0 : 1;
    const f = side === 0 ? home : away;
    const opposite = side === 0 ? away : home;
    const intensity = m.derby ? 1.3 : 1;
    m.ball = { x: rnd(12, 88), y: side === m.userSide ? rnd(10, 65) : rnd(35, 90) };
    for (const teamSide of [0, 1]) {
      const t = settings(teamSide);
      const members = active(m, teamSide);
      const passes = Math.round((teamSide === 0 ? homeShare : 100 - homeShare) / 100 * (t.style === 'Tiki-Taka' ? 12 : 10));
      m.stats[teamSide].passes += passes;
      m.stats[teamSide].completedPasses += Math.round(passes * clamp(.70 + (teamSide === 0 ? home.build : away.build) * .0017, .65, .92));
      for (const id of members) {
        const p = player(id);
        m.minutesPlayed[id] = (m.minutesPlayed[id] || 0) + 1;
        const work = p.posicion === 'POR' ? .07 : .16 + t.tempo * .0004 + t.pressing * .0003 + (t.style === 'Gegenpress' ? .055 : 0);
        p.condicion_fisica = clamp(p.condicion_fisica - work * intensity * (1.18 - p.fisico * .003));
        m.ratings[id] = clamp((m.ratings[id] || 6.5) + .001, 1, 10);
      }
    }
    if (Math.random() < .235 * intensity) {
      const foulSide = 1 - side;
      const defender = weighted(active(m, foulSide).map(player), p => p.posicion === 'POR' ? .1 : p.posicion === 'DEF' ? 2 : p.posicion === 'MED' ? 1.6 : .7);
      if (defender) {
        m.stats[foulSide].fouls++;
        const t = settings(foulSide);
        const calm = m.shout && foulSide === m.userSide && m.shout.action === 'calma' && m.minute <= m.shout.until;
        const aggression = (t.style === 'Garra/Huevo' ? 1.25 : 1) * (calm ? .75 : 1);
        if (Math.random() < .006 * intensity * aggression) giveCard(m, foulSide, defender.id, true);
        else if (Math.random() < .18 * intensity * aggression * (m.yellow[defender.id] ? .35 : 1)) giveCard(m, foulSide, defender.id);
        else if (m.derby && Math.random() < .12) log(`El árbitro cobra falta de ${defender.nombre}. Los bancos discuten y la tribuna aumenta la presión.`);
      }
    }
    if (Math.random() < .0028 * intensity) {
      const victimSide = Math.random() < .5 ? 0 : 1;
      const victim = weighted(active(m, victimSide).map(player), p => .5 + (100 - p.condicion_fisica) / 50);
      if (victim) {
        victim.injury = rnd(4, 24); victim.injuryType = pick(['Sobrecarga muscular', 'Distensión', 'Esguince leve', 'Golpe fuerte']);
        m.injured.push(victim.id); m.ratings[victim.id] = clamp((m.ratings[victim.id] || 6.5) - .1, 1, 10);
        m.injuryEvents.push({ minute: m.minute, side: victimSide, playerId: victim.id, days: victim.injury, type: victim.injuryType });
        log(`🚑 ${victim.nombre} pide el cambio. ${victim.injuryType}: el médico estima ${victim.injury} días de recuperación.`);
      }
    }
    const shotPace = .27 + (f.t.tempo - 50) * .00045 + f.t.mentality * .009 +
      (f.t.style === 'Gegenpress' ? .013 : f.t.style === 'Tiki-Taka' ? -.009 : 0) + (m.minute > 80 ? .035 : 0);
    if (Math.random() < clamp(shotPace, .18, .37)) {
      const openDefense = (opposite.t.line - 50) * .00018 + opposite.t.mentality * .003;
      const counter = f.t.style === 'Salida de Contragolpe' ? .006 : 0;
      takeShot(m, side, openDefense + counter + (side === 0 ? .002 : 0));
    }
    manageAI();
    if (m.minute === 45 && !m.halfTimeTaken) {
      m.halfTime = true; m.halfTimeTaken = true; m.paused = true;
      for (const teamSide of [0, 1]) for (const id of active(m, teamSide)) {
        player(id).condicion_fisica = clamp(player(id).condicion_fisica + 3);
      }
      clearInterval(timer);
      log('⏸ Entretiempo. El DT puede hablar con el equipo, ajustar la táctica y hacer cambios sin consumir una ventana.');
      saveGame(true);
    }
    if (m.minute === 90) {
      m.addedTime = clamp(m.addedTime + Math.floor(m.subEvents.length / 3) + Math.floor(m.injured.length / 2), 2, 7);
      log(`El cuarto árbitro indica ${m.addedTime} minutos de tiempo añadido.`);
    }
    if (m.minute >= 90 + m.addedTime) {
      m.done = true; m.paused = true; clearInterval(timer);
      if (currentEvent()?.type === 'LIB' && m.score[0] === m.score[1]) {
        m.pen = penalties(m.home, m.away); log(`🎯 La clasificación se define desde el punto penal: ${m.pen.home}–${m.pen.away}.`);
      }
      log('🏁 Final. El árbitro termina el partido y los jugadores saludan a la tribuna.');
      saveGame(true);
    } else if (m.minute % 15 === 0) saveGame(true);
    if (view === 'match') render();
  };

  penalties = (homeId = null, awayId = null) => {
    const result = { home: 0, away: 0, kicks: [], homeTaken: 0, awayTaken: 0 };
    const probability = side => {
      const m = GameState?.match;
      if (!m || homeId !== m.home || awayId !== m.away) return .76;
      const attackers = active(m, side).map(player).filter(p => p.posicion !== 'POR');
      const t = settings(side);
      const designated = attackers.find(p => p.id === Number(t.penaltyTaker));
      const ability = designated?.tiro || average(attackers, p => p.tiro, 72);
      return clamp(.76 + (ability - 72) * .002, .66, .86);
    };
    const kick = side => {
      const scored = Math.random() < probability(side);
      if (side === 0) { result.homeTaken++; if (scored) result.home++; }
      else { result.awayTaken++; if (scored) result.away++; }
      result.kicks.push({ side, scored });
    };
    const clinched = () => result.home > result.away + (5 - result.awayTaken) ||
      result.away > result.home + (5 - result.homeTaken);
    for (let round = 0; round < 5; round++) {
      kick(0); if (clinched()) return result;
      kick(1); if (clinched()) return result;
    }
    for (let round = 0; result.home === result.away && round < 50; round++) { kick(0); kick(1); }
    if (result.home === result.away) {
      const winner = Math.random() < .5 ? 0 : 1;
      result.homeTaken++; result.awayTaken++;
      result.kicks.push({ side: 0, scored: winner === 0 }, { side: 1, scored: winner === 1 });
      if (winner === 0) result.home++; else result.away++;
    }
    return result;
  };

  toggleMatch = () => {
    const m = GameState.match;
    if (!m || m.done) return;
    hydrate(m); m.paused = !m.paused; clearInterval(timer);
    if (!m.paused) { m.halfTime = false; timer = setInterval(tick, speed); }
    saveGame(true); render();
  };

  substitute = (outId, inId) => {
    if (!GameState.match || GameState.match.done) return;
    const out = Number(outId ?? $('#out')?.value);
    const into = Number(inId ?? $('#in')?.value);
    const error = doSub(GameState.match.userSide, out, into);
    if (error) { toast(error); return false; }
    saveGame(true); render(); return true;
  };

  window.matchShout = action => {
    const m = GameState.match;
    if (!m || m.done) return;
    hydrate(m);
    if (m.shout && m.minute < m.shout.cooldownUntil) return toast('Dejá que el equipo responda antes de dar otra indicación.');
    const leading = m.score[m.userSide] > m.score[1 - m.userSide];
    const options = {
      animar: { text: '¡Vamos, confío en ustedes! El banco anima al equipo.', attack: 1.8, build: .8, defense: .5 },
      exigir: leading ? { text: 'El DT exige más. Algunos jugadores sienten una presión innecesaria.', attack: -.5, build: -.5 } :
        { text: '¡Más intensidad! El DT exige una reacción inmediata.', attack: 2.5, defense: -.8 },
      concentrar: { text: '¡Concentración! El equipo vuelve a ordenar las marcas.', defense: 2.2, attack: -.5 },
      calma: { text: '¡Calma, con la pelota al piso! El equipo busca recuperar el control.', build: 2, defense: 1, attack: -.5 }
    };
    if (!options[action]) return;
    m.shout = { action, ...options[action], until: m.minute + 10, cooldownUntil: m.minute + 15 };
    for (const id of active(m,m.userSide)) player(id).moral=clamp(player(id).moral+(action==='animar'?2:action==='exigir'?(leading?-2:1):1));
    log('📣 ' + m.shout.text); saveGame(true); render();
  };

  window.activeMatchPlayers = side => GameState.match ? active(GameState.match, side) : [];
  window.hydrateMatch = (match = GameState?.match) => match ? hydrate(match) : null;
  window.matchMinuteLabel = minute => minute > 90 ? `90+${minute - 90}′` : `${minute}′`;
  window.getMatchResult = () => {
    const m = GameState.match;
    if (!m?.done) return null;
    hydrate(m);
    return { home: m.score[0], away: m.score[1], pen: m.pen,
      winner: m.score[0] === m.score[1]
        ? m.pen ? m.pen.home > m.pen.away ? m.home : m.away : null
        : m.score[0] > m.score[1] ? m.home : m.away,
      stats: m.stats.map(s => ({ ...s, xg: Math.round(s.xg * 100) / 100 })),
      goals: m.goalEvents.map(g => ({ ...g })),
      ratings: { ...m.ratings }, minute: m.minute };
  };
  window.makeMatchSubstitution = (out, into) => substitute(out, into);
})();

  const fullDate = value => {
    const iso = String(value || '').slice(0,10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return 'Sin dato publicado';
    const parsed = new Date(iso + 'T12:00:00Z');
    if (!Number.isFinite(parsed.getTime()) || parsed.toISOString().slice(0,10) !== iso) return 'Sin dato publicado';
    return parsed.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  };
  const tmEUR = p => Number.isFinite(p.transfermarkt?.marketValueEUR) && p.transfermarkt.marketValueEUR >= 0

  const tmReference = p => p.transfermarkt
    ? `<span class="fm-player-sub fm-source-reference">${tmLink(p.transfermarkt.profileUrl, 'TM: ' + tmEUR(p))}</span>`
    : `<span class="fm-player-sub">${p.realIdentity ? 'Fuente anterior · sin valoración TM' : 'Valor generado por el juego'}</span>`;

    return `<div class="fm-source-supplement"><h3>Archivo complementario de Transfermarkt</h3><div class="fm-source-fields"><div><span>Última tasación registrada</span><strong>${esc(value)}</strong><small>${esc(fullDate(ref.recordedValuationDate))}</small></div><div><span>Vencimiento del contrato en el archivo</span><strong>${esc(fullDate(ref.contractEnd))}</strong></div></div><p class="small muted">Registro de temporada ${esc(ref.lastSeason??'no informada')}. Las condiciones de tu carrera se gestionan por separado; estos datos no modifican fichajes ni contratos ya firmados. <a class="fm-source-link" href="https://github.com/dcaribou/transfermarkt-datasets" target="_blank" rel="noopener noreferrer">Procedencia del archivo ↗</a></p></div>`;

r carrera ${icon('arrow')}</button><button class="fm-import-label" data-action="import">Importar una carrera guardada</button><p class="fm-welcome-disclosure"><strong>Transfermarkt · participantes 2025.</strong> Los jugadores verificados incluyen perfil oficial, fecha de nacimiento, posición y valoración publicada en EUR. En cada ficha podés consultar la fuente y la fecha de consulta. Los planteles son históricos; las tasaciones conservan su fecha de publicación y se toman hasta el 31/12/2025. Los jugadores sin valor publicado al corte mantienen una estimación de juego. Atributos, potencial, salarios, contratos y cláusulas son estimaciones del juego. Conversión fija de juego: EUR 1 = USD 1,10. No hay actualización automática.<br>Guardado automático en este navegador. Exportá tu carrera para llevarla a otro dispositivo.</p></section></div>`;

iv><span class="fm-toolbar-label">${icon('calendar')} ${currentEvent()?currentEvent().type==='LPF'?`LPF · F${currentEvent().round}`:'Libertadores':'Fin de temporada'}</span></div><div id="content" class="fm-content">${(views[view]||views.dashboard)()}</div></main></div>`;

="fm-fixture-meta"><span>${competition(event)}</span><span>${date(event.date)}</span></div>${game?`<div class="fm-fixture-teams"><div class="fm-fixture-team">${shield(game.home,'large')}<strong>${esc(club(game.home).nombre)}</strong><small>LOCAL</small></div><div class="fm-fixture-vs">VS</div><div class="fm-fixture-team">${shield(game.away,'large')}<strong>${esc(club(game.away).nombre)}</strong><small>VISITANTE</small></div></div><div class="fm-fixture-footer"><p class="small muted" style="margin:0 0 12px">${esc(meta(game.home).stadium)}${isDerby(game)?' · <span class="gold">CLÁSICO</span>':''}</p><button class="primary" data-view="match">Preparar partido ${icon('arrow')}</button></div>`:`<p class="muted">Tu equipo no tiene compromiso en esta ronda continental.</p><button class="primary" data-action="advance">Avanzar jornada</button>`}`:`<p class="muted">${esc(seasonReport())}</p><button class="primary" data-action="season">Nueva temporada</button>`}</div><div class="card"><div class="fm-panel-title"><h2>Noticias del club</h2><button class="fm-text-button" data-view="inbox">Bandeja de entrada ${icon('chevron')}</button></div>${recentNews.map(item=>`<article class="fm-news-row">${icon('news')}<div><time>${date(item.date)}</time><h3>${esc(item.title)}</h3><p>${esc(item.body)}</p></div></article>`).join('')}</div></div><div><div class="card fm-table-card"><div class="fm-panel-title"><h2>Liga Profesional</h2><button class="fm-text-button" data-view="tables">Tabla completa</button></div><div class="scroll"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>DG</th><th>PTS</th></tr></thead><tbody>${rows.slice(0,6).map((row,index)=>`<tr class="${row.id===user.id?'mine':''} ${index<4?'lib':index<8?'sud':''}"><td>${index+1}</td><td>${shield(row.id,'small-shield')} <span style="margin-left:5px">${esc(club(row.id).nombre)}</span></td><td>${row.pj}</td><td>${row.gf-row.gc}</td><td><b>${row.pts}</b></td></tr>`).join('')}${place>6?`<tr class="mine"><td>${place}</td><td>${sh aining">${icon('chevron')}</button></li><li><div><strong>Cupo extranjero</strong><p>${foreigners(user.id)} de 6 jugadores</p></div>${foreigners(user.id)>=6?'<span class="gold small">COMPLETO</span>':'<span class="green small">DISPONIBLE</span>'}</li><li><div><strong>Presupuesto disponible</strong><p>${compactMoney(user.presupuesto_dolares)}</p></div><button class="fm-text-button" data-view="finances">${icon('chevron')}</button></li></ul></div></div></div>`;

  roster = function() {

    const headers={overview:`<th>Estado</th><th>${sort('condition','Cond.')}</th><th>${sort('morale','Moral')}</th><th>${sort('rating','Nota')}</th><th>${sort('ability','Calidad')}</th><th>${sort('potential','Potencial')}</th>`,contracts:`<th>Contrato estimado</th><th>${sort('value','Valor del juego / TM')}</th><th>${sort('salary','Salario est./sem')}</th><th>Cláusula estimada</th><th>Acciones</th>`,stats:`<th>${sort('apps','PJ')}</th><th>${sort('goals','Goles')}</th><th>Asist.</th><th>Minutos</th><th>Amarillas</th><th>${sort('rating','Nota')}</th>`,attributes:'<th>Ritmo</th><th>Tiro</th><th>Pase</th><th>Regate</th><th>Defensa</th><th>Físico</th>'};
    const cells=p=>({overview:`<td>${status(p)}</td><td>${condition(p)}</td><td><span class="${p.moral>65?'green':p.moral<40?'red':''}">${morale(p)}</span></td><td>${rating(p.lastRating||p.estado_forma)}</td><td>${stars(overall(p))}<span class="fm-player-sub">Media ${overall(p)}/99</span></td><td>${stars(p.potential||overall(p))}</td>`,contracts:`<td>Dic. ${p.contract}</td><td>${compactMoney(p.valor_mercado)}${tmReference(p)}</td><td>${money(p.salario)}</td><td>${compactMoney(p.clausula_rescision)}</td><td><button data-renew="${p.id}" ${locked()?'disabled':''}>Renovar</button> <button data-sell="${p.id}" ${locked()?'disabled':''}>Vender</button></td>`,stats:`<td>${p.appearances||0}</td><td><b>${p.goals||0}</b></td><td>${p.assists||0}</td><td>${p.minutes||0}′</td><td>${p.seasonYellow||p.yellowSeason||0}</td><td>${rating(p.lastRating||p.estado_forma)}</td>`,attributes:['ritmo','tiro','pase','regate','defensa','fisico'].map(key=>`<td class="${p[key]>=75?'green':p[key]<50?'muted':'gold'}"><b>${Math.max(1,Math.round(p[key]/5))}</b></td>`).join('')})[ui.rosterTab];
    return `<div class="fm-page-intro"><div><h2>Primer equipo</h2><p>${mine().length} jugadores · ${foreigners(GameState.userClub.id)} extranjeros de 6 · ${mine().filter(available).length} disponibles</p></div><button data-action="auto" ${locked()?'disabled':''}>${icon('tactics')} Selección automática</button></div><div class="fm-tabbar">${tab('roster','overview','Vista general',ui.rosterTab)}${tab('roster','contracts','Contratos',ui.rosterTab)}${tab('roster','stats','Estadísticas',ui.rosterTab)}${tab('roster','attributes','Atributos',ui.rosterTab)}</div><div class="card fm-table-card"><div class="fm-filters"><input id="rosterSearch" placeholder="Buscar jugador" value="${esc(ui.rosterSearch)}" aria-label="Buscar jugador"><select id="rosterPos"><option value="ALL">Todas las posiciones</option>${['POR','DEF','MED','DEL'].map(pos=>`<option ${pos===rosterPos?'selected':''}>${pos}</option>`).join('')}</select><span class="small muted">Clic en una columna para ordenar</span></div><div class="scroll"><table><thead><tr><th>#</th><th>${sort('name','Jugador')}</th><th>Inscr.</th><th>Posición</th><th>${sort('age','Edad')} / País</th>${headers[ui.rosterTab]}</tr></thead><tbody>${candidates.map((p,index)=>`<tr><td class="muted">${p.shirtNumber||p.number||p.jerseyNumber||index+1}</td><td><button class="fm-player-link" data-player="${p.id}">${esc(p.nombre)}</button><span class="fm-player-sub">${esc(p.role||p.posicion)}${GameState.tactics.captain===p.id?' · CAPITÁN':''}${!p.realIdentity?' · Juvenil generado':''}</span></td><td><input type="checkbox" data-registration="${p.id}" ${p.registered!==false?'checked':''} ${locked()?'disabled':''} aria-label="Inscribir a ${esc(p.nombre)}" title="Inscripción de jugador"></td><td><span class="fm-status-pill">${p.posicion}</span></td><td>${p.edad} <span class="fm-player-sub">${esc(p.nacionalidad)}</span></td>${cells(p)}</tr>`).join('')||`<tr><td colspan="12" class="empty">No hay jugadores con estos filtros.</td></tr>`}</tbody></table></div><div class="fm-table-footer"><span>${candidates.length} jugadores ${ui.rosterTab==='attributes'?'· escala visual 1–20 (motor 1–99)':''}</span><span>Atributos, potencial y cifras en USD estimados · EUR: referencia Transfermarkt</span></div></div>`;
  };

  pitch = function(ids,formation,awayIds=null,ball=null) {
    const dots=(members,form,away)=>positions(members,form,away).map((dot,index)=>{
      const p=player(dot.id);if(!p)return '';
      return `<button class="player ${away?'away':''}" style="left:${dot.x}%;top:${dot.y}%" data-player="${p.id}" title="${esc(p.nombre)} · ${p.posicion}"><span class="shirt">${p.shirtNumber||p.number||p.jerseyNumber||index+1}</span><span class="fm-pitch-name">${esc(playerName(p))}</span>${!away&&!awayIds?`<span class="fm-pitch-role">${esc(GameState.tactics.roles?.[p.id]||p.role||p.posicion)}</span>`:''}</button>`;
    }).join('');
    return `<div class="pitch" aria-label="Cancha táctica"><div class="area top"></div><div class="area bottom"></div><div class="fm-goal top"></div><div class="fm-goal bottom"></div>${dots(ids,formation,false)}${awayIds?dots(awayIds,'4-3-3',true):''}${ball?`<div class="ball" aria-hidden="true" style="left:${ball.x}%;top:${ball.y}%">⚽</div>`:''}</div>`;
  };

  tactics = function() {
    const tactic=GameState.tactics,eligible=mine().filter(available).sort((a,b)=>overall(b)-overall(a));
    const roles={POR:['Arquero','Arquero líbero'],DEF:['Defensor central','Lateral','Carrilero'],MED:['Pivote','Organizador','Volante mixto','Interior'],DEL:['Delantero avanzado','Delantero completo','Extremo','Hombre objetivo']};
    const lineups=(start,end)=>Array.from({length:end-start},(_,offset)=>{
      const index=start+offset,id=index<11?tactic.xi[index]:tactic.bench[index-11],p=player(id),position=index<11?FORMATIONS[tactic.formation][index]:'SUP';
      const playerRoles=roles[p?.posicion||position]||['Jugador de apoyo'];
      const selectedRole=tactic.roles?.[id]||p?.role||playerRoles[0];
      if(!playerRoles.includes(selectedRole))playerRoles.unshift(selectedRole);
      return `<div class="fm-lineup-row"><span class="fm-lineup-pos">${index<11?position:'S'+(index-10)}</span><div><select data-slot="${index}" ${locked()?'disabled':''} aria-label="${index<11?'Titular':'Suplente'} ${index+1}"><option value="">Sin asignar</option>${eligible.map(item=>`<option value="${item.id}" ${id===item.id?'selected':''}>${esc(item.nombre)} · ${item.posicion}</option>`).join('')}</select>${index<11&&p?`<select class="fm-role-select" data-role="${id}" ${locked()?'disabled':''} aria-label="Rol de ${esc(p.nombre)}">${playerRoles.map(role=>`<option ${role===selectedRole?'selected':''}>${esc(role)}</option>`).join('')}</select>`:''}</div><span class="fm-lineup-cond ${p&&p.condicion_fisica<65?'red':''}">${p?Math.round(p.condicion_fisica)+'%':'–'}</span></div>`;
    }).join('');
    return `<div class="fm-page-intro"><div><h2>Identidad de juego</h2><p>El esquema, los roles y las instrucciones influyen en el rendimiento y el desgaste.</p></div><button data-action="auto" ${locked()?'disabled':''}>Elegir mejor equipo</button></div><div class="fm-tactics-grid"><div class="card fm-tactic-options"><h2>Instrucciones del equipo</h2><label class="field">Formación<select id="formation" ${locked()?'disabled':''}>${Object.keys(FORMATIONS).map(form=>`<option ${form===tactic.formation?'selected':''}>${form}</option>`).join('')}</select></label><label class="field">Estilo táctico<select id="style">${STYLES.map(style=>`<option ${style===tactic.style?'selected':''}>${style}</option>`).join('')}</select></label><label class="field">Mentalidad<select data-tactic="mentality"><option ${tactic.mentality==='Cauta'?'selected':''}>Cauta</option><option ${!tactic.mentality||tactic.mentality==='Equilibrada'?'selected':''}>Equilibrada</option><option ${tactic.mentality==='Ofensiva'?'selected':''}>Ofensiva</option></select></label><div class="fm-tactic-section">${[['tempo','Ritmo'],['width','Amplitud'],['line','Línea defensiva'],['pressing','Presión']].map(([key,label])=>`<div class="fm-slider"><div class="fm-slider-label"><label for="tactic-${key}">${label}</label><span id="tactic-${key}-value">${tactic[key]??50}%</span></div><input id="tactic-${key}" type="range" min="10" max="90" step="10" value="${tactic[key]??50}" data-tactic="${key}" aria-label="${label}"></div>`).join('')}</div><div class="fm-tactic-section"><label class="field">Capitán<select data-captain ${locked()?'disabled':''}>${mine().map(p=>`<option value="${p.id}" ${tactic.captain===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label><label class="field">Lanzador de penales<select data-penalty ${locked()?'disabled':''}>${mine().filter(p=>p.posicion!=='POR').map(p=>`<option value="${p.id}" ${(tactic.penaltyTaker??tactic.penalty)===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label></div><div class="fm-notice">Intensidad alta mejora la presión, pero consume condición. Los jugadores fuera de posición reciben una penalización. Los cambios de formación se preparan antes del partido.</div></div><div class="card"><div class="fm-panel-title"><h2>${tactic.formation}</h2><span class="badge">${esc(tactic.mentality||'Equilibrada')}</span></div>${pitch(tactic.xi,tactic.formation)}<p class="small muted" style="margin-bottom:0">Clic en un jugador para abrir su ficha.</p></div><div class="card fm-lineup-card"><div class="fm-panel-title"><h2>Convocatoria</h2><span class="small muted">18 jugadores</span></div><div class="fm-lineup-groups"><div><div class="fm-subtitle">Once titular</div>${lineups(0,11)}</div><div><div class="fm-subtitle">Banco de suplentes</div>${lineups(11,18)}<div class="fm-notice">Seleccioná otro jugador para intercambiarlo con su compañero. Se necesitan 11 titulares y 7 suplentes disponibles.</div></div></div></div></div>`;
  };

  tableHtml = function(table) {
    return `<div class="scroll"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th><th>Últimos 5</th></tr></thead><tbody>${rank(table).map((row,index)=>`<tr class="${index<4?'lib':index<8?'sud':index>=10?'down':''} ${row.id===GameState.userClub.id?'mine':''}"><td>${index+1}</td><td>${shield(row.id,'small-shield')} <b style="margin-left:7px">${esc(club(row.id).nombre)}</b></td>${['pj','g','e','p','gf','gc'].map(key=>`<td class="fm-number">${row[key]}</td>`).join('')}<td class="fm-number">${row.gf-row.gc>0?'+':''}${row.gf-row.gc}</td><td><b>${row.pts}</b></td><td>${formPills(row.id)}</td></tr>`).join('')}</tbody></table></div>`;
  };

  tables = function() {
    const cupGame=game=>`<div class="fm-cup-game">${['home','away'].map(side=>`<div class="fm-cup-team ${game.result?.winner===game[side]?'winner':''}">${shield(game[side],'small-shield')}<span>${esc(club(game[side]).nombre)}</span><strong>${game.result?game.result[side]:'–'}</strong></div>`).join('')}${game.result?.pen?`<div class="small gold" style="text-align:right">Penales ${game.result.pen.home}–${game.result.pen.away}</div>`:''}</div>`;
    let content='';
    if(ui.tableTab==='annual'||ui.tableTab==='league')content=`<div class="card fm-table-card"><div class="fm-panel-title"><h2>${ui.tableTab==='annual'?'Tabla anual · clasificación continental':'Liga Profesional Argentina'}</h2><span class="badge">${GameState.year}</span></div>${tableHtml(ui.tableTab==='annual'?GameState.annual:GameState.standings)}<div class="fm-table-footer"><span>Desempates: puntos, diferencia de gol, goles a favor.</span><span>22 fechas · ida y vuelta</span></div><div class="fm-legend" style="padding-top:13px"><span>1º–4º Libertadores</span><span>5º–8º Sudamericana</span><span>11º–12º Zona de descenso</span></div></div><div class="fm-notice">Reglamento simplificado: LPF y tabla anual reúnen las mismas 22 fechas. La Sudamericana es una zona de clasificación; esta edición simula la fase final de Libertadores. La zona de descenso afecta el objetivo y la confianza; los clubes permanecen para la siguiente temporada.</div>`;
    if(ui.tableTab==='cup')content=`<div class="card"><div class="fm-panel-title"><h2 class="gold">Copa Libertadores · fase final</h2><span class="badge">PARTIDO ÚNICO</span></div><p class="small muted">Ocho clubes invitados · cuartos, semifinal y final · penales en caso de empate.</p><div class="fm-bracket">${GameState.cup.stages.map((games,index)=>`<section class="fm-bracket-round"><h3>${['Cuartos de final','Semifinales','Final'][index]}</h3>${games.length?games.map(cupGame).join(''):'<div class="fm-cup-game muted small">Se define al concluir la ronda anterior.</div>'}</section>`).join('')}</div>${GameState.cup.winner?`<div class="fm-notice gold">${icon('trophy')} Campeón de América: ${esc(club(GameState.cup.winner).nombre)}</div>`:''}</div>`;
    if(ui.tableTab==='calendar')content=`<div class="card fm-table-card"><div class="fm-panel-title"><h2>Calendario y resultados</h2><span class="small muted">Liga y Copa</span></div><div class="scroll"><table><thead><tr><th>Fecha</th><th>Competición</th><th>Local</th><th>Marcador</th><th>Visitante</th><th>Estado</th></tr></thead><tbody>${GameState.calendar.flatMap(event=>{const games=event.type==='LPF'?event.games:GameState.cup.stages[event.stage];return games.length?games.map(game=>`<tr class="${game.home===GameState.userClub.id||game.away===GameState.userClub.id?'mine':''}"><td>${date(event.date)}</td><td>${event.type==='LPF'?'LPF · F'+event.round:'Libertadores · '+['Cuartos','Semifinal','Final'][event.stage]}</td><td>${shield(game.home,'small-shield')} ${esc(club(game.home).nombre)}</td><td><b>${game.result?game.result.home+' – '+game.result.away:'vs'}</b>${game.result?.pen?` <span class="small gold">(p ${game.result.pen.home}–${game.result.pen.away})</span>`:''}</td><td>${shield(game.away,'small-shield')} ${esc(club(game.away).nombre)}</td><td>${event.done?'<span class="muted">Finalizado</span>':event.id===currentEvent()?.id?'<span class="green">Próxima jornada</span>':'Programado'}</td></tr>`):[`<tr><td>${date(event.date)}</td><td>Libertadores</td><td colspan="4" class="muted">Cruces pendientes de la ronda anterior</td></tr>`]}).join('')}</tbody></table></div></div>`;
    if(ui.tableTab==='leaders'){
      const top=GameState.players.filter(p=>p.clubId&&GameState.league.some(team=>team.id===p.clubId)).sort((a,b)=>(b.goals||0)-(a.goals||0)||(b.assists||0)-(a.assists||0)).slice(0,20);
      content=`<div class="card fm-table-card"><div class="fm-panel-title"><h2>Rendimiento en la temporada</h2><span class="small muted">Liga y Copa, totales registrados</span></div><div class="scroll"><table><thead><tr><th>#</th><th>Jugador</th><th>Club</th><th>Pos.</th><th>PJ</th><th>Goles</th><th>Asist.</th><th>Nota</th></tr></thead><tbody>${top.map((p,index)=>`<tr><td>${index+1}</td><td><button class="fm-player-link" data-player="${p.id}">${esc(p.nombre)}</button></td><td>${esc(club(p.clubId).nombre)}</td><td>${p.posicion}</td><td>${p.appearances||0}</td><td class="green"><b>${p.goals||0}</b></td><td>${p.assists||0}</td><td>${rating(p.lastRating||p.estado_forma)}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
    return `<div class="fm-competition-header">${icon('trophy')}<div><h2>Fútbol argentino y continental</h2><div class="small muted">Temporada ${GameState.year} · ${GameState.league.length} clubes · los domingos y las noches de Copa</div></div></div><div class="fm-tabbar">${tab('tables','annual','Tabla anual',ui.tableTab)}${tab('tables','league','Liga Profesional',ui.tableTab)}${tab('tables','cup','Libertadores',ui.tableTab)}${tab('tables','calendar','Calendario',ui.tableTab)}${tab('tables','leaders','Estadísticas',ui.tableTab)}</div>${content}`;
  };

  market = function() {
    const user=GameState.userClub;
    const candidates=GameState.players.filter(p=>p.clubId!==user.id&&p.contract>=GameState.year&&(marketPos==='ALL'||p.posicion===marketPos)&&(ui.marketAge==='all'||p.edad<=Number(ui.marketAge))&&(!ui.marketBudget||transferCost(p)<=user.presupuesto_dolares)&&(ui.marketClub==='all'||ui.marketClub==='free'&&!p.clubId||ui.marketClub===p.clubId)&&`${p.nombre} ${p.nacionalidad} ${p.clubId?club(p.clubId)?.nombre:'Libre'}`.toLowerCase().includes(marketQuery.toLowerCase())).sort((a,b)=>overall(b)-overall(a));
    const pages=Math.max(1,Math.ceil(candidates.length/25));ui.marketPage=Math.min(ui.marketPage,pages-1);
    const displayed=candidates.slice(ui.marketPage*25,(ui.marketPage+1)*25);
    const offers=(GameState.offers||[]).filter(offer=>offer.status==='pending');
    return `<div class="fm-page-intro"><div><h2>Centro de fichajes</h2><p>Buscá talento, pedí un informe y negociá las condiciones del pase.</p></div><button data-view="scouting">${icon('scouting')} Ver ojeo</button></div><div class="fm-metrics"><div class="fm-metric">${icon('finances')}<label>Presupuesto</label><div class="stat" style="font-size:23px">${compactMoney(user.presupuesto_dolares)}</div><span class="small">Fondos disponibles</span></div><div class="fm-metric">${icon('users')}<label>Cupos extranjeros</label><div class="stat ${foreigners(user.id)>=6?'gold':''}">${foreigners(user.id)}<span class="small"> / 6</span></div><span class="small">Plantel y convocatoria</span></div><div class="fm-metric">${icon('squad')}<label>Plantel</label><div class="stat">${mine().length}<span class="small"> / 32</span></div><span class="small">Capacidad máxima</span></div><div class="fm-metric">${icon('scouting')}<label>Lista de seguimiento</label><div class="stat">${GameState.scouting?.shortlist?.length||0}</div><span class="small">Objetivos observados</span></div></div>${typeof transferSummary==='function'?transferSummary():''}${typeof transferWindowOpen==='function'?`<div class="fm-offer-summary">${icon('calendar')} ${transferWindowOpen()?'Mercado de pases abierto · se pueden registrar incorporaciones.':'Mercado de pases cerrado · podés preparar negociaciones para la próxima ventana.'}</div>`:''}${offers.length?`<div class="fm-offer-summary">${icon('market')} ${offers.length} oferta${offers.length===1?'':'s'} pendiente${offers.length===1?'':'s'}. Las respuestas llegarán a tu bandeja de entrada al avanzar el tiempo.</div>`:''}<div class="card fm-table-card"><div class="fm-filters"><input id="marketQuery" placeholder="Nombre, club o nacionalidad" value="${esc(marketQuery)}" aria-label="Buscar en el mercado"><select id="marketPos"><option value="ALL">Todas las posiciones</option>${['POR','DEF','MED','DEL'].map(pos=>`<option ${pos===marketPos?'selected':''}>${pos}</option>`).join('')}</select><select data-market-filter="age" aria-label="Edad máxima"><option value="all">Todas las edades</option>${[21,25,30].map(age=>`<option value="${age}" ${ui.marketAge===String(age)?'selected':''}>Hasta ${age} años</option>`).join('')}</select><select data-market-filter="club" aria-label="Club de origen"><option value="all">Todos los clubes</option><option value="free" ${ui.marketClub==='free'?'selected':''}>Agentes libres</option>${[...GameState.league,...GameState.continental,...(GameState.external||[])].filter(team=>team.id!==user.id).map(team=>`<option value="${team.id}" ${ui.marketClub===team.id?'selected':''}>${esc(team.nombre)}</option>`).join('')}</select><label class="row small"><input type="checkbox" data-market-filter="budget" ${ui.marketBudget?'checked':''}> Dentro del presupuesto</label></div><div class="scroll"><table><thead><tr><th>Jugador / club</th><th>Posición</th><th>Edad / País</th><th>Calidad / potencial estimados</th><th>Precio del juego / TM</th><th>Salario est. / sem</th><th>Acciones</th></tr></thead><tbody>${displayed.map(p=>`<tr><td><button class="fm-player-link" data-player="${p.id}">${esc(p.nombre)}</button><span class="fm-player-sub">${p.clubId?esc(club(p.clubId)?.nombre||'Club'): 'Agente libre'}${!p.realIdentity?' · Generado':''}</span></td><td><span class="fm-status-pill">${p.posicion}</span><span class="fm-player-sub">${esc(p.role||'')}</span></td><td>${p.edad}<span class="fm-player-sub">${esc(p.nacionalidad)}</span></td><td>${stars(overall(p))}<span class="fm-player-sub">Potencial ${p.potential||overall(p)} · Media ${overall(p)}</span></td><td>${compactMoney(transferCost(p))}${tmReference(p)}</td><td>${money(p.salario)}</td><td><button data-buy="${p.id}" ${locked()?'disabled':''}>Negociar</button> <button data-shortlist="${p.id}" title="Seguir jugador">${icon(GameState.scouting?.shortlist?.includes(p.id)?'trust':'star')}</button> <button data-scout="${p.id}" title="Pedir informe de ojeo">${icon('scouting')}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No se encontraron jugadores con estos filtros.</td></tr>'}</tbody></table></div><div class="fm-table-footer"><span>${candidates.length} resultados · Página ${ui.marketPage+1} de ${pages}</span><div class="row"><button data-market-page="${ui.marketPage-1}" ${ui.marketPage===0?'disabled':''}>Anterior</button><button data-market-page="${ui.marketPage+1}" ${ui.marketPage>=pages-1?'disabled':''}>Siguiente</button></div></div></div><div class="fm-notice">Los precios en USD, salarios y contratos son estimaciones de la simulación. La segunda cifra muestra la valoración en EUR publicada por Transfermarkt cuando existe; abrí el enlace o la ficha para verificar la fuente. Conversión inicial del juego: EUR 1 = USD 1,10. La valoración de referencia no se actualiza durante la carrera. El club vendedor y el jugador evalúan cada oferta.</div>`;
  };

  details = function(id) {
    const p=player(id);if(!p)return;
    const belongs=p.clubId===GameState.userClub.id;
    const attr=(key,label)=>{
      const raw=p.attributes?.[key]??p[key]??60;
      const score=Math.max(1,Math.min(20,Math.round(raw/5)));
      return `<div class="fm-attribute"><span>${label}</span><b class="${score<13?'medium':''}">${score}</b></div>`;
    };
    const position = p.transfermarkt?.positionDetail || p.role || p.posicion;
    const foot = p.transfermarkt ? p.transfermarkt.foot || 'Sin dato publicado' : `${p.foot || 'derecho'} (estimado)`;
    $('#details').innerHTML=`<div class="fm-profile-header"><div class="fm-profile-avatar">${esc(initials(p))}</div><div><div class="fm-kicker" style="color:#c3acd8">Ficha del jugador</div><h2>${esc(p.nombre)}</h2><p>${esc(position)} · ${p.edad} años en la carrera · ${esc(p.nacionalidad)}</p><p>${p.clubId?esc(club(p.clubId)?.nombre||'Club'):'Agente libre'} · Pie ${esc(foot)} · ${status(p)}</p></div><div style="margin-left:auto;align-self:start">${p.clubId?shield(p.clubId):icon('squad')}</div></div>${tmProfileSource(p)}<div class="fm-profile-grid"><section><h2>Atributos técnicos estimados</h2>${attr('tiro','Remate')}${attr('pase','Pase')}${attr('regate','Regate')}${attr('defensa',p.posicion==='POR'?'Atajadas':'Defensa')}<p class="small muted">Estimaciones de la simulación. Escala visual 1–20; el motor calcula sobre 1–99.</p></section><section><h2>Físico y estado del juego</h2>${attr('ritmo','Velocidad')}${attr('fisico','Fortaleza')}<div class="fm-attribute"><span>Condición</span><b>${Math.round(p.condicion_fisica)}%</b></div><div class="fm-attribute"><span>Moral</span><b>${morale(p)}</b></div><div class="fm-attribute"><span>Última nota</span>${rating(p.lastRating||p.estado_forma)}</div><div class="fm-attribute"><span>Personalidad estimada</span><b>${esc(p.personalidad||'Profesional')}</b></div></section><section><h2>Evaluación y contrato del juego</h2><div class="fm-attribute"><span>Calidad estimada</span>${stars(overall(p))}</div><div class="fm-attribute"><span>Potencial estimado</span>${stars(p.potential||overall(p))}</div><div class="fm-attribute"><span>Valor de la simulación</span><b>${compactMoney(p.valor_mercado)}</b></div><div class="fm-attribute"><span>Salario estimado / semana</span><b>${money(p.salario)}</b></div><div class="fm-attribute"><span>Contrato estimado hasta</span><b>Dic. ${p.contract}</b></div><div class="fm-attribute"><span>Cláusula estimada</span><b>${compactMoney(p.clausula_rescision)}</b></div><p class="small muted">Conversión inicial de referencia: EUR 1 = USD 1,10. El valor y las condiciones evolucionan con la carrera.</p></section></div><div class="fm-profile-stats" aria-label="Estadísticas de la carrera"><div><strong>${p.appearances||0}</strong><span>Partidos</span></div><div><strong>${p.goals||0}</strong><span>Goles</span></div><div><strong>${p.assists||0}</strong><span>Asistencias</span></div><div><strong>${p.minutes||0}′</strong><span>Minutos</span></div></div><p class="fm-portrait-disclosure">${p.argentineCitizen?'Cuenta con ciudadanía argentina a efectos de la inscripción del juego. ':''}${p.realIdentity?'Identidad real; afiliación de base histórica. Atributos, potencial, personalidad, contrato, salario y cláusula estimados para la simulación.':'Jugador generado por la cantera del juego.'} Estadísticas de tu carrera. Monograma ilustrado propio.</p><div class="fm-modal-actions">${belongs?`<button data-renew="${p.id}" ${locked()?'disabled':''}>Renovar contrato</button><button data-sell="${p.id}" ${locked()?'disabled':''}>Vender jugador</button>`:`<button data-shortlist="${p.id}">${GameState.scouting?.shortlist?.includes(id)?'Quitar del seguimiento':'Añadir a seguimiento'}</button><button data-scout="${p.id}">Pedir informe</button><button class="primary" data-buy="${p.id}" ${locked()?'disabled':''}>Negociar fichaje</button>`}<button data-action="close">Cerrar ficha</button></div>`;
    if(!$('#details').open)$('#details').showModal();
  };

  matchView = function() {
    const m=GameState.match,event=currentEvent(),game=fixture(event),user=GameState.userClub;
    if(!m){
      const opposite=game?game.home===user.id?game.away:game.home:null;
      const home=game?game.home:null,away=game?game.away:null;
      return `<div class="fm-page-intro"><div><h2>Preparación del partido</h2><p>${competition(event)}${event?' · '+date(event.date):''}</p></div><button data-view="tactics">Revisar táctica</button></div>${game?`<div class="card fm-match-scoreboard"><div class="fm-kicker">${isDerby(game)?'CLÁSICO · LA CIUDAD SE PARALIZA':'LA PRÓXIMA PRUEBA'}</div><div class="fm-fixture-teams" style="max-width:650px;margin:22px auto"><div class="fm-fixture-team">${shield(home,'large')}<strong>${esc(club(home).nombre)}</strong><small>LOCAL</small></div><div class="fm-fixture-vs">VS</div><div class="fm-fixture-team">${shield(away,'large')}<strong>${esc(club(away).nombre)}</strong><small>VISITANTE</small></div></div><p class="small muted">${esc(meta(home).stadium)} · ${esc(meta(home).city)}</p><button class="primary" data-action="kickoff">Ir al campo de juego ${icon('arrow')}</button></div><div class="fm-briefing-grid"><div class="card"><h2>Informe del rival</h2><ul class="fm-briefing-list"><li>${esc(club(opposite).nombre)} · nivel competitivo ${club(opposite).rating}/99.</li><li>${club(opposite).rating>club(user.id).rating?'El rival tiene una valoración superior; cuidá las pérdidas y los espacios.':'Tu plantel tiene una valoración competitiva ante este rival; hacé valer tu plan de juego.'}</li><li>${isDerby(game)?'Clásico: +30% de intensidad. El resultado duplica el impacto en la moral y en la hinchada.':'La localía aporta una pequeña ventaja en posesión y generación de ocasiones.'}</li><li>Cuatro estilos y cinco cambios disponibles. Tres ventanas, además del entretiempo.</li></ul></div><div class="card"><h2>Tu plan para hoy</h2><ul class="fm-briefing-list"><li>Formación: <strong>${GameState.tactics.formation}</strong>.</li><li>Estilo: <strong>${esc(GameState.tactics.style)}</strong>. Mentalidad: ${esc(GameState.tactics.mentality||'Equilibrada')}.</li><li>${mine().filter(p=>p.injury).length} lesionados y ${mine().filter(p=>p.ban).length} suspendidos.</li><li>La presión y el ritmo altos aumentan el desgaste; el entretiempo permite ajustar el equipo.</li></ul><button data-view="tactics">Modificar convocatoria</button></div></div>`:`<div class="card"><h2>${event?'Jornada continental':'Temporada finalizada'}</h2><p class="muted">${event?'Tu club no disputa esta ronda. Se simularán los cruces restantes y llegará el informe de la jornada.':esc(seasonReport())}</p><button class="primary" data-action="${event?'advance':'season'}">${event?'Avanzar jornada':'Comenzar nueva temporada'}</button></div>`}`;
    }
    const possession=m.stats[0].poss+m.stats[1].poss,homePoss=Math.round(m.stats[0].possession??(possession?m.stats[0].poss/possession*100:50)),side=m.userSide;
    const bench=GameState.tactics.bench.filter(id=>!m.used.includes(id)&&!m.lineups.flat().includes(id)&&available(player(id)));
    const matchStat=(label,a,b,percentage=false)=>`<div class="fm-match-stat"><strong>${percentage?a+'%':a}</strong><div class="fm-match-stat-label">${label}<div class="fm-versus-bar"><span style="width:${Number(a)+Number(b)?Number(a)/(Number(a)+Number(b))*100:50}%"></span><span style="flex:1"></span></div></div><strong>${percentage?b+'%':b}</strong></div>`;
    const minute=m.minute>90?`90+${m.minute-90}`:m.minute;
    const liveIds=m.lineups[side].map(id=>m.red.includes(id)||m.injured.includes(id)?null:id);
    const opponentIds=m.lineups[1-side].map(id=>m.red.includes(id)||m.injured.includes(id)?null:id);
    return `<div class="card fm-match-scoreboard"><div class="fm-kicker">${competition(event)} ${m.derby?'· CLÁSICO':''}</div><div class="fm-match-score-grid"><div class="fm-fixture-team">${shield(m.home,'large')}<strong>${esc(club(m.home).nombre)}</strong></div><div><div class="score">${m.score[0]} – ${m.score[1]}</div><div class="fm-match-minute">${m.done?'Final del partido':m.paused?'Pausado':'En juego'} · ${minute}′</div></div><div class="fm-fixture-team">${shield(m.away,'large')}<strong>${esc(club(m.away).nombre)}</strong></div></div>${m.pen?`<div class="gold small">Penales ${m.pen.home}–${m.pen.away}</div>`:''}<div class="fm-match-controls">${m.done?'<button class="primary" data-action="finish">Informe y avanzar jornada</button>':`<button class="primary" data-action="play">${m.paused?'Reanudar partido':'Pausar partido'}</button><select id="speed" aria-label="Velocidad del partido"><option value="500" ${speed===500?'selected':''}>Velocidad 1×</option><option value="180" ${speed===180?'selected':''}>Velocidad 3×</option><option value="50" ${speed===50?'selected':''}>Velocidad 10×</option></select><select id="liveStyle" aria-label="Estilo en vivo">${STYLES.map(style=>`<option ${style===GameState.tactics.style?'selected':''}>${style}</option>`).join('')}</select>`}</div></div><div class="fm-match-grid"><div><div class="card" style="padding:12px">${pitch(liveIds,GameState.tactics.formation,opponentIds,m.ball)}<div class="small muted" style="margin:9px 3px 1px">${esc(user.nombre)}: camiseta violeta · rival: camiseta clara · clic para abrir ficha</div></div><div class="card"><h2>Estadísticas del partido</h2>${matchStat('Posesión',homePoss,100-homePoss,true)}${matchStat('Tiros totales',m.stats[0].shots,m.stats[1].shots)}${matchStat('Tiros al arco',m.stats[0].shotsOnTarget||0,m.stats[1].shotsOnTarget||0)}${matchStat('Goles esperados (xG)',Number(m.stats[0].xg||0).toFixed(2),Number(m.stats[1].xg||0).toFixed(2))}${matchStat('Córners',m.stats[0].corners||0,m.stats[1].corners||0)}${matchStat('Faltas',m.stats[0].fouls,m.stats[1].fouls)}${matchStat('Tarjetas amarillas',m.stats[0].yellow,m.stats[1].yellow)}${matchStat('Expulsiones',m.stats[0].red,m.stats[1].red)}</div></div><div><div class="card"><div class="fm-panel-title"><h2>Relato en directo</h2><span class="badge">${minute}′</span></div><div class="feed" aria-live="polite">${m.feed.map(item=>`<p><b>${item.minute}′</b>${esc(item.text)}</p>`).join('')}</div></div><div class="card fm-match-sub"><div class="fm-panel-title"><h2>Banco de suplentes</h2><span class="badge">${m.substitutions}/5 cambios · ${m.substitutionWindows?.[side]||m.windowsUsed||m.subWindows||0}/3 ventanas</span></div><div class="row"><select id="out" aria-label="Jugador que sale" ${!m.paused||m.done?'disabled':''}>${m.lineups[side].filter(id=>!m.red.includes(id)).map(id=>`<option value="${id}">${esc(player(id).nombre)}${m.injured.includes(id)?' · LES':' · '+Math.round(player(id).condicion_fisica)+'%'}</option>`).join('')}</select><select id="in" aria-label="Jugador que entra" ${!m.paused||m.done?'disabled':''}>${bench.map(id=>`<option value="${id}">${esc(player(id).nombre)} · ${player(id).posicion}</option>`).join('')}</select></div><button data-action="sub" style="margin-top:10px" ${!m.paused||m.done||m.substitutions>=5||!bench.length?'disabled':''}>Confirmar cambio</button><p class="small muted">Pausá para realizar cambios. Varias sustituciones en la misma pausa usan una ventana. El entretiempo no usa una ventana.</p></div><div class="card"><h2>Charla desde la línea</h2><div class="fm-match-shouts">${[['animar','Alentar'],['exigir','Exigir'],['calma','Calmar']].map(([key,label])=>`<button data-shout="${key}" ${m.done?'disabled':''}>${label}</button>`).join('')}</div><p class="small muted" style="margin-bottom:0">El mensaje influye en la moral. Elegí el momento; no todas las arengas tienen el mismo efecto.</p></div></div></div><div class="card fm-table-card"><div class="fm-panel-title"><h2>Rendimiento individual</h2><span class="small muted">Titulares y jugadores sustituidos</span></div><div class="grid cols2" style="padding:0 15px">${[0,1].map(teamSide=>{const teamId=teamSide===0?m.home:m.away;const ids=[...new Set([...m.lineups[teamSide],...Object.keys(m.ratings).map(Number).filter(id=>player(id)?.clubId===teamId)])];return `<div><h3 style="margin:14px 0">${shield(teamId,'small-shield')} ${esc(club(teamId).nombre)}</h3><div class="scroll"><table><thead><tr><th>Jugador</th><th>Cond.</th><th>Nota</th><th>Estado</th></tr></thead><tbody>${ids.map(id=>{const p=player(id);if(!p)return '';return `<tr><td><button class="fm-player-link" data-player="${id}">${esc(p.nombre)}</button><span class="fm-player-sub">${p.posicion}</span></td><td>${condition(p)}</td><td>${rating(m.ratings[id]||6.5)}</td><td>${m.red.includes(id)?'<span class="fm-status-pill bad">EXP</span>':m.injured.includes(id)?'<span class="fm-status-pill bad">LES</span>':m.lineups[teamSide].includes(id)?m.yellow[id]?'<span class="fm-status-pill" style="color:#e7d594">AM</span>':'<span class="small green">En campo</span>':'<span class="small muted">Sustituido</span>'}</td></tr>`}).join('')}</tbody></table></div></div>`}).join('')}</div></div>`;
  };

  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||button.disabled)return;
    if(button.dataset.uiTab){ui[button.dataset.uiTab==='roster'?'rosterTab':'tableTab']=button.dataset.uiValue;render();}
    if(button.dataset.rosterSort){if(ui.rosterSort===button.dataset.rosterSort)ui.rosterOrder*=-1;else {ui.rosterSort=button.dataset.rosterSort;ui.rosterOrder=ui.rosterSort==='name'?1:-1;}render();}
    if(button.dataset.marketPage!==undefined){ui.marketPage=Math.max(0,Number(button.dataset.marketPage));render();}
  });
  document.addEventListener('change',event=>{
    const node=event.target;
    if(node.id==='club'&&!GameState){ui.selectedClub=node.value;$('#selectedClubPreview').innerHTML=summaryClub(node.value);}
    if(node.dataset.marketFilter){const field=node.dataset.marketFilter;ui[field==='age'?'marketAge':field==='club'?'marketClub':'marketBudget']=field==='budget'?node.checked:node.value;ui.marketPage=0;render();}
    if(node.id==='marketPos'||node.id==='marketQuery'){ui.marketPage=0;render();}
  });
  let filterTimer;
  document.addEventListener('input',event=>{
    const node=event.target;
    if(node.id==='rosterSearch'||node.id==='marketQuery'){
      clearTimeout(filterTimer);
      filterTimer=setTimeout(()=>{if(node.id==='rosterSearch')ui.rosterSearch=node.value;else {marketQuery=node.value;ui.marketPage=0;}render();},180);
    }
    if(node.dataset.tactic){const label=$('#tactic-'+node.dataset.tactic+'-value');if(label)label.textContent=node.value+'%';}
  });
})();

restoreGame();if(GameState?.match)view="match";render();
</script></body></html>
